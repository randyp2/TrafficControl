name: packet-loss-toggle

streams:
  - name: telemetry
    protocol: udp
    target: 127.0.0.1:5000
    rate: 1000
    payload: packet-loss
    seed: 42

events:
  - at: 2s
    stream: telemetry
    action: set_loss
    loss_percent: 10

  - at: 5s
    stream: telemetry
    action: set_loss
    loss_percent: 0

  - at: 8s
    stream: telemetry
    action: stop
