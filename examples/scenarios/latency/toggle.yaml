name: latency-toggle

streams:
  - name: telemetry
    protocol: udp
    target: 127.0.0.1:5000
    rate: 10
    payload: latency-toggle

events:
  - at: 2s
    stream: telemetry
    action: set_latency
    latency: 750ms

  - at: 5s
    stream: telemetry
    action: set_latency
    latency: 0s

  - at: 8s
    stream: telemetry
    action: stop
