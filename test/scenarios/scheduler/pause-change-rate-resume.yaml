name: pause-change-rate-resume

streams:
  - name: telemetry
    protocol: udp
    target: 127.0.0.1:5000
    rate: 2
    payload: telemetry

events:
  - at: 2s
    stream: telemetry
    action: pause

  - at: 4s
    stream: telemetry
    action: set_rate
    rate: 10

  - at: 6s
    stream: telemetry
    action: resume

  - at: 8s
    stream: telemetry
    action: stop
