name: multi-stream-independent

streams:
  - name: telemetry
    protocol: udp
    target: 127.0.0.1:5000
    rate: 2
    payload: telemetry

  - name: backend
    protocol: udp
    target: 127.0.0.1:6000
    rate: 1
    payload: backend

events:
  - at: 2s
    stream: telemetry
    action: set_rate
    rate: 8

  - at: 3s
    stream: backend
    action: set_rate
    rate: 5

  - at: 5s
    stream: telemetry
    action: stop

  - at: 7s
    stream: backend
    action: stop
